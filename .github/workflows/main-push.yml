name: Main Branch Push
on:
  push:
    branches:
      - main
      - exp/main-push-permission-check
# HARNESS ONLY: mimic upstream's read-only GITHUB_TOKEN default (this fork's default is write)
permissions:
  contents: read
  packages: read
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
  e2e-linux:
    uses: ./.github/workflows/e2e-linux.yml
    # e2e-linux.yml requests packages: write, and a called workflow cannot exceed
    # the caller's token permissions. Without this block the run fails at startup.
    permissions:
      contents: read
      packages: write
